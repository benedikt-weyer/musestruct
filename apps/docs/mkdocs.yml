site_name: Musestruct Docs
site_description: Setup and integration guides for the Musestruct workspace.
site_url: https://benedikt-weyer.github.io/musestruct/
repo_name: musestruct
repo_url: https://github.com/benedikt-weyer/musestruct
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
nav:
  - Overview: index.md
  - Setup Overview: setup-overview.md
  - Backend:
      - Caching Strategies: backend/caching-strategies.md
      - Database Schema: backend/database-schema.md
  - Providers:
      - Spotify: providers/spotify.md
      - Tidal: providers/tidal.md
  - Sources:
      - Server / Local Source: sources/server-local.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
